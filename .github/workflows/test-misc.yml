# Checks that do not fit into any of the per-platform workflows, i.e. the unity build and code formatting. These all run on a stock
# x86_64 Linux runner.
name: misc

on: workflow_call

# Limit permissions on the repository
permissions:
  contents: read

jobs:
  # Run meson unity build to check for errors, unused functions, and externed functions
  unity:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          path: pgbackrest

      - name: Install
        run: |
          sudo apt-get update
          DEBCONF_NONINTERACTIVE_SEEN=true DEBIAN_FRONTEND=noninteractive sudo apt-get install -y zlib1g-dev libssl-dev \
            libxml2-dev libpq-dev pkg-config meson liblz4-dev libzstd-dev libbz2-dev

      - name: Build
        run: |
          meson setup --unity=on -Dwerror=true build ${GITHUB_WORKSPACE?}/pgbackrest
          ninja -vC build

      # Check that the binary exports exactly the symbols expected. FN_EXTERN and friends are defined as static for the unity
      # build, so anything beyond what the C runtime, the linked libraries, and the bundled libbacktrace provide is a function or
      # variable that escaped that treatment. The list is compared in the order nm emits it, which is sorted by name. Update the
      # list when the exported symbol set changes.
      - name: Check
        run: |
          diff - <(nm -gj --defined-only build/src/pgbackrest) <<'EOF'
          _IO_stdin_used
          __TMC_END__
          __bss_start
          __data_start
          __dso_handle
          __environ@GLIBC_2.2.5
          _edata
          _end
          _fini
          _init
          _start
          backtrace_alloc
          backtrace_close
          backtrace_create_state
          backtrace_dwarf_add
          backtrace_free
          backtrace_full
          backtrace_get_view
          backtrace_initialize
          backtrace_open
          backtrace_pcinfo
          backtrace_qsort
          backtrace_release_view
          backtrace_syminfo
          backtrace_syminfo_to_full_callback
          backtrace_syminfo_to_full_error_callback
          backtrace_uncompress_lzma
          backtrace_uncompress_zdebug
          backtrace_uncompress_zstd
          backtrace_vector_finish
          backtrace_vector_grow
          backtrace_vector_release
          data_start
          environ@GLIBC_2.2.5
          main
          stderr@GLIBC_2.2.5
          xmlFree@LIBXML2_2.4.30
          EOF

  # Check that code is correctly formatted
  code-format:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          path: pgbackrest

      # The formatters and the PyYAML the harness needs to load. Nothing else is required since the check only reads the source.
      - name: Install
        run: |
          sudo apt-get update
          DEBCONF_NONINTERACTIVE_SEEN=true DEBIAN_FRONTEND=noninteractive sudo apt-get install -y uncrustify black \
            python3-yaml

      # On failure the check says how to fix what it found so it can be run locally
      - name: Check
        run: ${GITHUB_WORKSPACE?}/pgbackrest/test/test.py code-format --check
