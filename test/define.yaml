# **********************************************************************************************************************************
# Test Definition
#
# Contains definitions for all unit, integration, performance, and tool tests.
#
# Each type is a list of test modules, each named for the path of the test module it defines, e.g. common/type/string is
# test/src/module/common/type/stringTest.c. Every module must have a name and a C module must also have a total. If this total does
# not match the actual number of tests in the module then an error will be thrown. A tool test is python and the rest are C.
#
# An entry that sets only options and defines no test is not a test module but the options that every module under its path
# inherits, e.g. the "build" entry sets the vms every module under build/ runs on. It must be declared before those modules and a
# module may override what it inherits. An option is only valid for one type, so each is documented with the type it belongs to.
#
# The keys below define a test module:
#     * define - defines for C code (will also be applied to the test harness)
#     * binReq - is the pgbackrest binary required for this test?
#     * containerReq - is this test required to run in a container?
#     * coverage - a list of code modules that the test provides coverage for. A code module may be covered by multiple tests. That
#         means you must run all the tests by providing the --module option multiple times to get full coverage on the code module.
#         If a code module contains only data it should be marked noCode (e.g. - help/help.auto: noCode). If a code module is
#         included in another code module it should be marked as included (e.g. - md5.vendor: included).
#     * feature - Defines a feature that is now available in the harness. For example, the "error" feature defines HRN_FEATURE_ERROR
#         used to automatically check for errors in later tests. The common/error/error test is not able to access this error
#         handling because it is used to implement the error handling, so it must do error testing in a more primitive way.
#     * harness - Adds a harness module that contains functions to aid in testing. For example, the "log" harness includes the
#         harness/log module to aid in expect log testing.
#       * shim - list of modules that are shimmed in the harness, included in the order listed. This allows the harness to access
#         static elements of the module to provide additional services for unit testing. An entry is either a bare module name or a
#         map with a name and a 'function' list. In the latter case the listed functions in the C module will be appended with
#         _SHIMMED and an implementation with the same function signature must be provided in the harness. Generally speaking this
#         function will default to calling the original function, but after some initialization the shim may implement other logic
#         that is useful for unit testing.
#     * depend - Source modules that this test depends on that have not already been included in prior tests via coverage. Ideally
#         this option would never be used because it is essentially documenting cross-dependencies in the code.
#     * total - total tests in the module
#     * include - modules to include directly into test.c (all files in coverage are automatically included)
#           This is useful when a module's internal data needs to be manipulated for testing but no coverage is added by the test.
# **********************************************************************************************************************************

# **********************************************************************************************************************************
