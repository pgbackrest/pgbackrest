# **********************************************************************************************************************************
# Integration tests
#
# Integration tests are not run in a container. They are expected to create their own containers since most integration runs will
# create more than one. For this reason each run is executed individually.
#
# Only an integration test may set this option:
#     * db - determines if the test will be run against multiple db versions
# **********************************************************************************************************************************
integration:

  # --------------------------------------------------------------------------------------------------------------------------------
  - name: integration/all
    db: true
    total: 1
    harness: host

# **********************************************************************************************************************************
# Performance tests
#
# Performance tests run in a single container but are more like integration tests than unit tests since they call the pgbackrest
# executable directly.
# **********************************************************************************************************************************
performance:

  # --------------------------------------------------------------------------------------------------------------------------------
  - name: performance/type
    total: 6

  # --------------------------------------------------------------------------------------------------------------------------------
  - name: performance/storage
    total: 2

    include:
      - storage/helper

# **********************************************************************************************************************************
# Tool tests
#
# Tests for the build, documentation, and test tools. These are python so they are run directly rather than built, which means no
# total is needed since there are no tests to select.
#
# Only a tool may set this option, since the tools are the same everywhere while a C test is exercising the platform it runs on:
#     * vm - VMs that the test will be run on
#
# This type is last so that nothing it declares can affect the modules compiled into any other test.
# **********************************************************************************************************************************
tool:

  # ********************************************************************************************************************************
  # The build library, which every tool is built on. It is declared before the doc and test libraries so that those inherit it,
  # which is the same direction the import hierarchy runs in.
  # ********************************************************************************************************************************
  - name: build
